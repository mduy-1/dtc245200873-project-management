server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: web-files
    static_configs:
      - targets: [localhost]
        labels:
          job: project-management
          service: app
          __path__: /logs/app/*.log
      - targets: [localhost]
        labels:
          job: project-management
          service: nginx
          __path__: /logs/nginx/*.log
