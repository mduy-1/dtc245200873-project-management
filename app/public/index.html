<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý dự án</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><span>PM / ĐỀ 14</span><h1>Không gian dự án</h1><p>Dự án, công việc và thành viên trong một nơi.</p></header><main><div id="summary"></div><p id="message" role="status"></p><section class="forms"><form id="project"><h2>Tạo dự án</h2><input name="name" placeholder="Tên dự án" required maxlength="200"><input name="description" placeholder="Mô tả" maxlength="2000"><button>Tạo dự án</button></form><form id="member"><h2>Thêm thành viên</h2><input name="name" placeholder="Họ tên" required maxlength="200"><input name="email" type="email" placeholder="Email" required><button>Thêm thành viên</button></form><form id="task"><h2>Thêm công việc</h2><input name="title" placeholder="Tên công việc" required maxlength="200"><select name="project_id" id="projects" required></select><select name="member_id" id="members"></select><button>Tạo công việc</button></form></section><h2>Bảng công việc</h2><div id="board"></div><h2>Danh sách dự án</h2><div id="project-list"></div><h2>Thành viên</h2><div id="member-list"></div></main><footer>Project Management · Docker Compose Lab</footer></body></html>
