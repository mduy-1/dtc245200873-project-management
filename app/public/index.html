<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý dự án</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<aside class="sidebar"><a class="brand" href="/">PM <span>/ ĐỀ 14</span></a><p class="nav-label">KHÔNG GIAN LÀM VIỆC</p><nav aria-label="Điều hướng"><button class="nav-item active" data-view="tasks" aria-current="page"><span aria-hidden="true">▦</span>Bảng công việc<b id="nav-count">0</b></button><button class="nav-item" data-view="projects"><span aria-hidden="true">▤</span>Dự án</button><button class="nav-item" data-view="members"><span aria-hidden="true">♧</span>Thành viên</button></nav><div class="sidebar-footer">Project Management<br><small>dtc245200873</small></div></aside>
<main><div class="breadcrumb">Không gian làm việc <span>/</span> <span id="breadcrumb">Bảng công việc</span></div><header><div><h1 id="page-title">Danh sách công việc</h1><p id="description">Theo dõi và cập nhật công việc của bạn.</p></div><button class="primary" id="add-button">＋ Thêm công việc</button></header><section class="panel" aria-label="Danh sách"><div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Tìm kiếm" placeholder="Tìm kiếm công việc…"></label><select id="project-filter" aria-label="Lọc dự án"><option value="">Tất cả dự án</option></select><span id="summary" role="status"></span></div><div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div class="table-footer" id="table-footer"></div></section><footer>Project Management · PostgreSQL</footer></main>
<div id="message" class="toast" role="status" hidden></div>
<dialog id="create-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title">Thêm công việc</h2><button id="close-dialog" aria-label="Đóng">×</button></div><p id="dialog-error" role="alert" hidden></p><form id="task" hidden><label for="task-title">Tên công việc</label><input id="task-title" name="title" placeholder="Nhập tên công việc" required maxlength="200"><label for="projects">Dự án</label><select name="project_id" id="projects" required></select><label for="members">Người phụ trách</label><select name="member_id" id="members"></select><button class="primary" type="submit">Tạo công việc</button></form><form id="project" hidden><label for="project-name">Tên dự án</label><input id="project-name" name="name" placeholder="Nhập tên dự án" required maxlength="200"><label for="project-description">Mô tả</label><textarea id="project-description" name="description" placeholder="Mô tả ngắn về dự án" maxlength="2000" rows="3"></textarea><button class="primary" type="submit">Tạo dự án</button></form><form id="member" hidden><label for="member-name">Họ tên</label><input id="member-name" name="name" placeholder="Nhập họ tên" required maxlength="200"><label for="member-email">Email</label><input id="member-email" name="email" type="email" placeholder="thanhvien@example.com" required maxlength="200"><button class="primary" type="submit">Thêm thành viên</button></form></dialog></body></html>
