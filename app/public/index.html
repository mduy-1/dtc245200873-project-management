<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý dự án</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<aside class="sidebar"><a class="sidebar-brand" href="/">PM <span>/ ĐỀ 14</span></a><p class="nav-label">KHÔNG GIAN LÀM VIỆC</p><nav aria-label="Điều hướng"><button class="nav-item active" data-view="board" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span><span>Bảng công việc</span><b id="nav-count">0</b></button><button class="nav-item" data-view="projects"><span class="nav-icon" aria-hidden="true">▤</span><span>Dự án</span></button><button class="nav-item" data-view="members"><span class="nav-icon" aria-hidden="true">♧</span><span>Thành viên</span></button></nav><div class="sidebar-footer">Project Management<br><small>dtc245200873</small></div></aside>
<div class="page-shell"><header><span>PM / ĐỀ 14</span><h1 id="page-title">Không gian dự án</h1><p id="page-description">Dự án, công việc và thành viên trong một nơi.</p></header><main><div id="summary"></div><p id="message" role="status"></p>
<section class="forms"><form id="project"><h2>Tạo dự án</h2><label class="sr-only" for="project-name">Tên dự án</label><input id="project-name" name="name" placeholder="Tên dự án" required maxlength="200"><label class="sr-only" for="project-description">Mô tả</label><input id="project-description" name="description" placeholder="Mô tả" maxlength="2000"><button>Tạo dự án</button></form><form id="member"><h2>Thêm thành viên</h2><label class="sr-only" for="member-name">Họ tên</label><input id="member-name" name="name" placeholder="Họ tên" required maxlength="200"><label class="sr-only" for="member-email">Email</label><input id="member-email" name="email" type="email" placeholder="Email" required><button>Thêm thành viên</button></form><form id="task"><h2>Thêm công việc</h2><label class="sr-only" for="task-title">Tên công việc</label><input id="task-title" name="title" placeholder="Tên công việc" required maxlength="200"><label class="sr-only" for="projects">Dự án</label><select name="project_id" id="projects" required></select><label class="sr-only" for="members">Người phụ trách</label><select name="member_id" id="members"></select><button>Tạo công việc</button></form></section>
<section id="board-view"><h2>Bảng công việc</h2><div id="board"></div></section><section id="projects-view" hidden><h2>Danh sách dự án</h2><div id="project-list"></div></section><section id="members-view" hidden><h2>Thành viên</h2><div id="member-list"></div></section></main><footer>Project Management · Docker Compose Lab</footer></div></body></html>
